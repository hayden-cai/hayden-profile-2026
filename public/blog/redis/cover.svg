<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="72" y="118" font-size="14" letter-spacing="4" fill="#f87171">REDIS · FIELD NOTES</text>
  <text x="68" y="232" font-size="76" font-weight="700" letter-spacing="-3" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">Redis,</text>
  <text x="68" y="326" font-size="76" font-weight="700" letter-spacing="-3" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">beyond cache.</text>
  <text x="72" y="392" font-size="17" fill="#8a8a8a">One in-memory store, five jobs —</text>
  <text x="72" y="418" font-size="17" fill="#8a8a8a">each a handful of commands away.</text>
  <g font-size="13" letter-spacing="1">
    <rect x="72" y="470" width="110" height="32" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="127" y="491" text-anchor="middle" fill="#bbbbbb">5 PATTERNS</text>
    <rect x="194" y="470" width="120" height="32" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="254" y="491" text-anchor="middle" fill="#bbbbbb">TYPESCRIPT</text>
    <rect x="326" y="470" width="96" height="32" rx="3" fill="none" stroke="#f87171" stroke-opacity="0.45"/>
    <text x="374" y="491" text-anchor="middle" fill="#f87171">IOREDIS</text>
  </g>

  <!-- Spokes from hub to each use case -->
  <g stroke="#f87171" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="900" y1="315" x2="900" y2="147"/>
    <line x1="900" y1="315" x2="1080" y2="256"/>
    <line x1="900" y1="315" x2="1012" y2="469"/>
    <line x1="900" y1="315" x2="788" y2="469"/>
    <line x1="900" y1="315" x2="720" y2="256"/>
  </g>

  <!-- Hub: stacked layers -->
  <circle cx="900" cy="315" r="78" fill="#0b0b0c" stroke="#f87171" stroke-opacity="0.3"/>
  <path d="M900 330 L956 354 L900 378 L844 354 Z" fill="#ef4444" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-linejoin="round" transform="translate(0 -15)"/>
  <path d="M900 330 L956 354 L900 378 L844 354 Z" fill="#ef4444" fill-opacity="0.55" stroke="#f87171" stroke-width="1.5" stroke-linejoin="round" transform="translate(0 -35)"/>
  <path d="M900 330 L956 354 L900 378 L844 354 Z" fill="#ef4444" fill-opacity="0.85" stroke="#fca5a5" stroke-width="1.5" stroke-linejoin="round" transform="translate(0 -55)"/>

  <!-- Use-case nodes -->
  <g font-size="13" letter-spacing="1.5" text-anchor="middle">
    <rect x="830" y="125" width="140" height="44" rx="6" fill="#141414" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="900" y="152" fill="#eeeeee">CACHE</text>

    <rect x="1005" y="234" width="150" height="44" rx="6" fill="#141414" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="1080" y="261" fill="#eeeeee">SESSIONS</text>

    <rect x="937" y="447" width="150" height="44" rx="6" fill="#141414" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="1012" y="474" fill="#eeeeee">RATE LIMIT</text>

    <rect x="703" y="447" width="170" height="44" rx="6" fill="#141414" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="788" y="474" fill="#eeeeee">LEADERBOARD</text>

    <rect x="645" y="234" width="150" height="44" rx="6" fill="#141414" stroke="#f87171" stroke-opacity="0.55"/>
    <text x="720" y="261" fill="#eeeeee">LOCKS</text>
  </g>

  <!-- Command hints under each node -->
  <g font-size="11" fill="#777777" text-anchor="middle">
    <text x="900" y="188">GET · SET EX</text>
    <text x="1080" y="297">HSET · EXPIRE</text>
    <text x="1012" y="510">INCR · ZADD</text>
    <text x="788" y="510">ZINCRBY · ZREVRANK</text>
    <text x="720" y="297">SET NX PX</text>
  </g>
</svg>
