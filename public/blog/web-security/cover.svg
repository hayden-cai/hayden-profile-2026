<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="72" y="118" font-size="14" letter-spacing="4" fill="#60a5fa">WEB SECURITY · FIELD NOTES</text>
  <text x="68" y="232" font-size="84" font-weight="700" letter-spacing="-3" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">Defense</text>
  <text x="68" y="326" font-size="84" font-weight="700" letter-spacing="-3" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">in Depth.</text>
  <text x="72" y="392" font-size="17" fill="#8a8a8a">No single wall. Every layer assumes</text>
  <text x="72" y="418" font-size="17" fill="#8a8a8a">the one before it has already failed.</text>
  <g font-size="13" letter-spacing="1">
    <rect x="72" y="470" width="118" height="32" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="131" y="491" text-anchor="middle" fill="#bbbbbb">20 ATTACKS</text>
    <rect x="202" y="470" width="106" height="32" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="255" y="491" text-anchor="middle" fill="#bbbbbb">5 LAYERS</text>
    <rect x="320" y="470" width="128" height="32" rx="3" fill="none" stroke="#60a5fa" stroke-opacity="0.4"/>
    <text x="384" y="491" text-anchor="middle" fill="#60a5fa">OWASP 2025</text>
  </g>

  <!-- Defense layers, outer to inner -->
  <g fill="none">
    <rect x="660" y="80" width="460" height="470" rx="30" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="712" y="132" width="356" height="366" rx="24" stroke="#60a5fa" stroke-opacity="0.38" stroke-width="2"/>
    <rect x="764" y="184" width="252" height="262" rx="18" stroke="#60a5fa" stroke-opacity="0.58" stroke-width="2"/>
    <rect x="816" y="236" width="148" height="158" rx="12" stroke="#60a5fa" stroke-opacity="0.85" stroke-width="2" fill="#60a5fa" fill-opacity="0.06"/>
  </g>
  <g font-size="11" letter-spacing="2" fill="#60a5fa">
    <text x="684" y="108" fill-opacity="0.55">EDGE</text>
    <text x="736" y="160" fill-opacity="0.7">GATEWAY / WAF</text>
    <text x="788" y="212" fill-opacity="0.85">APPLICATION</text>
    <text x="890" y="382" text-anchor="middle">DATA</text>
  </g>

  <!-- Shield -->
  <path d="M890 262 L934 278 V310 C934 336 915 352 890 362 C865 352 846 336 846 310 V278 Z" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M872 311 L885 324 L909 298" fill="none" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Attacks stopped at different layers -->
  <g stroke="#f87171" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)">
    <line x1="560" y1="150" x2="652" y2="150"/>
    <line x1="560" y1="262" x2="704" y2="262"/>
    <line x1="560" y1="372" x2="756" y2="372"/>
    <line x1="560" y1="470" x2="652" y2="470"/>
  </g>
  <g font-size="12" fill="#f87171" text-anchor="end" letter-spacing="1">
    <text x="548" y="154">DDoS</text>
    <text x="548" y="266">BOTS</text>
    <text x="548" y="376">SQLi</text>
    <text x="548" y="474">MitM</text>
  </g>
  <g stroke="#f87171" stroke-width="2.5" stroke-linecap="round">
    <path d="M654 142l12 16M666 142l-12 16"/>
    <path d="M706 254l12 16M718 254l-12 16"/>
    <path d="M758 364l12 16M770 364l-12 16"/>
    <path d="M654 462l12 16M666 462l-12 16"/>
  </g>
</svg>
